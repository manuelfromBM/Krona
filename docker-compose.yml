version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - apps/backend/.env
    volumes:
      - .:/app
    command: npm run dev --workspace=backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env
    depends_on:
      - backend
    volumes:
      - .:/app
    command: npm run dev --workspace=web
